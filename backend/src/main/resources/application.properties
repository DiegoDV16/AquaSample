server.port=8080
spring.application.name=aquasample-backend

spring.datasource.url=${AQUASAMPLE_DB_URL:jdbc:h2:file:./data/aquasample;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La API usa JWT; no crear el usuario Basic por defecto de Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Esquema versionado con Flyway. baseline 1 permite adoptar una base existente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Fotos de evidencia
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Carpeta de fotos (en Render con disco: /var/data/uploads)
aquasample.uploads.dir=${AQUASAMPLE_UPLOAD_DIR:uploads}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
